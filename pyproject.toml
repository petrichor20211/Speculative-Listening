[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speclisten"
version = "0.1.0"
description = "Speculative Listening and TickTock-Bench for chunk-interleaved full-duplex speech language models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["numpy", "pyyaml", "scipy", "soundfile"]  # the model stacks are per target, see envs/

[project.optional-dependencies]
sessions = ["datasets", "huggingface_hub"]
test = ["pytest", "torch"]

[tool.setuptools]
# src/ is the package itself: import it as ``speclisten`` (pip install -e . into every interpreter that runs it)
package-dir = { speclisten = "src" }
packages = ["speclisten", "speclisten.bench", "speclisten.targets"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["speclisten"]
known-third-party = ["src"]  # duplex_repo's model code, not this src/

[tool.ruff.lint.per-file-ignores]
"src/bench/judge.py" = ["E501"]  # the judge prompt is quoted verbatim
